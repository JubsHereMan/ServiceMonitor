<!DOCTYPE html>
<html>
<head>
    <title>Monitoramento</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>Status dos Serviços</h1>

    <div class="list">
        {{range .}}
            <div class="card">
                <span class="service">{{.Service}}</span>
                <span class="status {{.Status}}">
                    {{.Status}}
                </span>
            </div>
        {{end}}
    </div>
</div>

<script src="/static/js/script.js"></script>
</body>
</html>
